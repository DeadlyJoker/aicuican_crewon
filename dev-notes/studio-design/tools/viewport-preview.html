<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studio 响应式检查</title><style>body{margin:0;background:#303030;color:#ddd;font:13px system-ui}header{height:44px;display:flex;align-items:center;gap:12px;padding:0 16px}input{width:64px;background:#222;border:1px solid #666;color:#eee;padding:4px}button{background:#222;border:1px solid #666;color:#eee;padding:5px 10px;border-radius:5px}main{overflow:auto;padding:16px;display:flex;justify-content:center}iframe{border:1px solid #555;flex-shrink:0;width:390px;height:600px;background:#111}</style></head><body><header><label>宽度 <input type="number" id="width" min="320" max="2560" value="390"></label><label>高度 <input type="number" id="height" min="400" max="1600" value="600"></label><button id="apply">应用尺寸</button><span>仅用于本地布局检查</span></header><main><iframe src="../index.html" title="Studio 预览"></iframe></main><script>document.getElementById('apply').onclick=()=>{for(const key of ['width','height']){const input=document.getElementById(key);if(!input.reportValidity())return;document.querySelector('iframe').style[key]=input.value+'px'}}</script></body></html>
