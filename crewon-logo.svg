<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- 背景：深夜蓝 -->
  <rect width="400" height="400" rx="80" fill="#0E1A2B"/>

  <!-- 光晕 -->
  <circle cx="250" cy="270" r="70" fill="#2EE6A8" opacity="0.12"/>
  <circle cx="250" cy="270" r="48" fill="#2EE6A8" opacity="0.22"/>

  <!-- 翅膀 -->
  <ellipse cx="150" cy="190" rx="70" ry="38" fill="#A5B4C8" opacity="0.25" transform="rotate(-28 150 190)"/>
  <ellipse cx="210" cy="150" rx="66" ry="34" fill="#A5B4C8" opacity="0.22" transform="rotate(22 210 150)"/>

  <!-- 身体 -->
  <ellipse cx="185" cy="235" rx="62" ry="72" fill="#1B2B42" stroke="#2B3E5C" stroke-width="3"/>

  <!-- 发光尾巴 -->
  <circle cx="245" cy="270" r="40" fill="#2EE6A8"/>
  <circle cx="236" cy="260" r="12" fill="#B9FFE8" opacity="0.9"/>

  <!-- 头 -->
  <circle cx="140" cy="195" r="58" fill="#22344F" stroke="#2B3E5C" stroke-width="3"/>

  <!-- 触角 -->
  <path d="M 118 150 Q 100 120 92 112" stroke="#2B3E5C" stroke-width="5" fill="none" stroke-linecap="round"/>
  <circle cx="90" cy="110" r="6" fill="#2EE6A8"/>
  <path d="M 152 144 Q 158 116 168 106" stroke="#2B3E5C" stroke-width="5" fill="none" stroke-linecap="round"/>
  <circle cx="170" cy="104" r="6" fill="#2EE6A8"/>

  <!-- 眼睛 -->
  <ellipse cx="122" cy="196" rx="13" ry="16" fill="#FFFFFF"/>
  <circle cx="126" cy="192" r="6" fill="#0E1A2B"/>
  <ellipse cx="158" cy="196" rx="13" ry="16" fill="#FFFFFF"/>
  <circle cx="162" cy="192" r="6" fill="#0E1A2B"/>

  <!-- 微笑 -->
  <path d="M 130 220 Q 141 232 152 220" stroke="#2B3E5C" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- 小脚 -->
  <ellipse cx="160" cy="306" rx="12" ry="8" fill="#22344F"/>
  <ellipse cx="200" cy="308" rx="12" ry="8" fill="#22344F"/>
</svg>
