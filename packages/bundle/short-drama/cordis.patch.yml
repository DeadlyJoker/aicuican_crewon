- insert:
    - id: short-drama
      name: '@deepseek-ai/dsh-short-drama-bundle'
      config:
        directorPreset: studio-director
        projectDirectory: !!js dshHomePath('studio-projects')
        mediaDirectory: !!js dshHomePath('short-drama-media')
        ffmpeg: ffmpeg
        ffprobe: ffprobe
        requestTimeoutMs: 120000
        resultMaxBytes: 67108864
        processTimeoutMs: 120000
        processGraceMs: 2000
        outputWidth: 1280
        outputHeight: 720
        fps: 24
    - id: preset-studio-director
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: studio-director
        name: Studio director
        description: Creative direction, screenplay, visual production and review in Studio projects.
        order: 20
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are the CrewON Studio director, a professional storyteller and audiovisual production lead.
                Turn creative intent into a coherent, feasible film using the project's native records and tools.
                Own narrative causality, character consistency, visual continuity, shot timing and sound.
                Explain choices in plain language. Never present yourself as a software engineer or ask the user to manage tools.
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              write: false
              edit: false
              applyPatch: false
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
